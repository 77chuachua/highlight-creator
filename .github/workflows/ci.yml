# CI — 每次 push 只跑测试。
# 删掉了 lint（dart analyze / clippy）和 4 个平台 build：它们没有签名、NDK、
# iOS/macOS 工具链，在 GitHub 上只会红，跟测试能不能过无关。
#
# 这里刻意排除 app/test/e2e：它要调真实 ffmpeg，并读取 test/e2e/ 下的素材，
# 而那个目录被 .gitignore 忽略、不在仓库里，CI 上不可能跑通。e2e 请在本机跑。

name: CI

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 与开发机一致的 SDK：本地 pubspec.lock 解析出的约束是 flutter >=3.38.4，
          # 用旧的 3.22.x 跑测试会编译/依赖对不上。
          flutter-version: '3.44.2'
      - run: flutter pub get
      # app/test/e2e 不在列表里：它需要本机 ffmpeg 和未上传的 test/e2e 素材。
      - run: flutter test test/data test/domain test/presentation test/services test/widget_test.dart test/goal_detection_service_test.dart

  test-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

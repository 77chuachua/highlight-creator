[workspace]
members = [
    "core",
    "gpu",
    "bridge",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"
repository = "https://github.com/example/highlight-creator"

[workspace.dependencies]
# FFmpeg bindings (Phase 3; crates opt in with `optional = true`)
ffmpeg-next = "7.0"

# Image processing
image = "0.25"

# Parallelism
crossbeam = "0.8"
rayon = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
log = "0.4"
env_logger = "0.11"

# FFI support
flutter_rust_bridge = "2.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

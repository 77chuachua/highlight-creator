name: highlight_creator
description: Cross-platform video highlight creator with effects.
publish_to: 'none'
version: 0.4.0+0

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # SHA-256 for downloaded template plugin scripts (integrity check).
  crypto: ^3.0.7

  # State management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # Dependency injection
  get_it: ^7.7.0

  # Database
  drift: ^2.16.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # File picking
  file_picker: ^8.0.0

  # Video playback (Windows FFmpeg)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.5

  # FFI
  ffi: ^2.1.2
  flutter_rust_bridge: ^2.3.0

  # Utilities
  uuid: ^3.0.7

  # Window management (OS close interception)
  window_manager: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting. dart_code_metrics is gone: it is discontinued and it pinned the
  # whole analyzer chain to 5.x, which held every other dependency back.
  flutter_lints: ^6.0.0

  # Code generation. Only drift generates code here; the freezed / json /
  # riverpod generators were listed but never used by a single file.
  build_runner: ^2.4.9
  drift_dev: ^2.16.1

  # Testing
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  # Beginner guide screenshots (generated by test/e2e/guide_screenshots_test.dart).
  assets:
    - windows/res/
